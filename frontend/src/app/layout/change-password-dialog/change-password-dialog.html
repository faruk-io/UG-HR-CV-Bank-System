<div class="backdrop">
  <section class="surface dialog" role="dialog" aria-label="Change my password">
    @if (!done()) {
      <header>
        <h2>Change my password</h2>
        <button class="close" type="button" (click)="closed.emit()">×</button>
      </header>

      @if (error(); as message) {
        <p class="banner danger">{{ message }}</p>
      }

      <div class="fields">
        <div class="field">
          <label for="currentPassword">Current password</label>
          <input
            id="currentPassword"
            type="password"
            autocomplete="current-password"
            [disabled]="busy()"
            [ngModel]="current()"
            (ngModelChange)="patch({ current: $event })"
          />
        </div>

        <div class="field">
          <label for="newPassword">New password</label>
          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            [disabled]="busy()"
            [ngModel]="next()"
            (ngModelChange)="patch({ next: $event })"
          />
          <small class="hint">At least 8 characters, with one letter and one digit.</small>
        </div>

        <div class="field">
          <label for="confirmPassword">Repeat new password</label>
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            [disabled]="busy()"
            [ngModel]="confirm()"
            (ngModelChange)="patch({ confirm: $event })"
          />
        </div>
      </div>

      <footer>
        <button class="btn" type="button" [disabled]="busy()" (click)="closed.emit()">Cancel</button>
        <button
          class="btn btn-primary"
          type="button"
          [disabled]="!canSubmit"
          (click)="submit()"
        >
          {{ busy() ? 'Changing…' : 'Change password' }}
        </button>
      </footer>
    } @else {
      <h2>Password changed</h2>
      <p class="message">
        Your password is updated. Sign in again with the new password to keep using the system.
      </p>
      <footer>
        <button class="btn btn-primary" type="button" (click)="signOut()">Sign in again</button>
      </footer>
    }
  </section>
</div>
